# NGINX baseline for the Railgun benchmark rig.
#
# Tuned to give NGINX its best showing, deliberately: a baseline that is not
# tuned makes any Railgun win meaningless. Every setting here that departs from
# the default is documented with the reason.

# Rendered by render.sh. NOT "auto": auto is sysconf(_SC_NPROCESSORS_ONLN),
# which ignores the CPU affinity mask, so under the taskset pinning that spec
# §4.3 mandates NGINX would silently get more workers than Railgun gets Ps.
# worker_cpu_affinity auto does honour the inherited mask and binds one worker
# per allowed core.
worker_processes  __WORKER_PROCESSES__;
worker_cpu_affinity auto;
worker_rlimit_nofile 200000;

events {
    worker_connections 65536;
    # accept_mutex is off by default in modern NGINX; stated explicitly so the
    # baseline's accept strategy is visible rather than assumed.
    accept_mutex off;
    use epoll;
    multi_accept on;
}

http {
    access_log  off;             # logging would measure the disk, not the proxy
    error_log   /var/log/nginx/error.log crit;

    # Neither proxy compresses. Stated rather than inherited so it cannot drift.
    gzip off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  300s;
    keepalive_requests 1000000;

    upstream origin {
        # Loopback is deliberate and is what makes the noise floor subtractable:
        # the origin runs on rig-proxy (setup-host.sh, bench/README.md), so the
        # proxied path and the --null-url path each cross the network exactly
        # once and the delta is proxy cost alone. Spec §4.1's line putting the
        # origin servers on rig-load is stale; the scripts are authoritative.
        server 127.0.0.1:9001;
        # Upstream keepalive is essential: without it NGINX opens a new
        # connection per request and the benchmark measures connect() cost
        # instead of proxy cost.
        keepalive 512;
        keepalive_requests 1000000;
    }

    server {
        # reuseport puts the kernel in charge of distributing accepts, matching
        # the strategy Railgun uses (spec §5.1), so the comparison is between
        # proxies rather than between accept strategies.
        listen 8080 reuseport backlog=65535;

        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";   # required for upstream keepalive

            # Buffering stays on because it is NGINX's best showing, but the
            # defaults must not: with ~32 KiB of proxy_buffers and
            # proxy_max_temp_file_size at 1024m, every 1 MiB W2/W4 response
            # overflows to a file in proxy_temp_path. The baseline would then
            # include a disk write and read that Railgun's splice relay never
            # performs, and beating that proves nothing.
            #
            # 0 disables temp files outright, which is the streaming behaviour
            # and the closest analogue to Railgun's relay.
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_max_temp_file_size 0;

            # Defaults, made explicit because they are load-bearing for parity:
            # NGINX silently retries the next upstream on error or timeout, so
            # Railgun must match that policy or report errors where NGINX
            # reports none (see PARITY.md).
            proxy_next_upstream error timeout;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
