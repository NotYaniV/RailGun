# NGINX baseline for the Railgun benchmark rig.
#
# Tuned to give NGINX its best showing, deliberately: a baseline that is not
# tuned makes any Railgun win meaningless. Every setting here that departs from
# the default is documented with the reason.

worker_processes  auto;          # one worker per core, NGINX's own recommendation
worker_rlimit_nofile 200000;

events {
    worker_connections 65536;
    # accept_mutex is off by default in modern NGINX; stated explicitly so the
    # baseline's accept strategy is visible rather than assumed.
    accept_mutex off;
    use epoll;
    multi_accept on;
}

http {
    access_log  off;             # logging would measure the disk, not the proxy
    error_log   /var/log/nginx/error.log crit;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  300s;
    keepalive_requests 1000000;

    upstream origin {
        server 127.0.0.1:9001;
        # Upstream keepalive is essential: without it NGINX opens a new
        # connection per request and the benchmark measures connect() cost
        # instead of proxy cost.
        keepalive 512;
        keepalive_requests 1000000;
    }

    server {
        # reuseport puts the kernel in charge of distributing accepts, matching
        # the strategy Railgun uses (spec §5.1), so the comparison is between
        # proxies rather than between accept strategies.
        listen 8080 reuseport backlog=65535;

        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";   # required for upstream keepalive
            proxy_buffering on;
        }
    }
}
